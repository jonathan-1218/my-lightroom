  <defs>
    <clipPath id="bands">
      <rect x="0" y="18" width="100" height="32"/>
      <rect x="0" y="53" width="100" height="4"/>
      <rect x="0" y="60.5" width="100" height="3.5"/>
    </clipPath>
  </defs>
  <circle cx="50" cy="44" r="25" fill="#e3b45f" clip-path="url(#bands)"/>
  <rect x="20" y="74" width="60" height="3.5" rx="1.75" fill="#8a8a8a"/>
  <circle cx="62" cy="75.75" r="6.5" fill="#e3b45f"/>
</svg>
