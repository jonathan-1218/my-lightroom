<!-- Full-bleed tile for macOS 26+, which masks app icons to its own shape (a pre-rounded tile gets framed). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <clipPath id="bands">
      <rect x="0" y="18" width="100" height="32"/>
      <rect x="0" y="53" width="100" height="4"/>
      <rect x="0" y="60.5" width="100" height="3.5"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <g transform="translate(102 97) scale(8.2)">
    <circle cx="50" cy="44" r="25" fill="#e3b45f" clip-path="url(#bands)"/>
    <rect x="20" y="74" width="60" height="3.5" rx="1.75" fill="#8a8a8a"/>
    <circle cx="62" cy="75.75" r="6.5" fill="#e3b45f"/>
  </g>
</svg>
